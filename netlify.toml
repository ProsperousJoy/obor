# Netlify config — OBOR static dashboard + API proxy
# The dashboard (static/) uses relative paths (/api/*, /stream),
# so we proxy them to the backend. No code changes, no CORS needed.

[build]
  publish = "static"

# ── Asset path fix ───────────────────────────────────────────────
# index.html references /static/index.css + /static/app.js (FastAPI mount
# style), but Netlify serves the static/ folder contents at the site
# root. Rewrite /static/* to /* so assets resolve.
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200
  force = true

# ── Proxy all API calls to the OBOR backend ─────────────────────
# TODO: replace with your Render backend URL after deploying it, e.g.
#   https://obor-backend.onrender.com
[[redirects]]
  from = "/api/*"
  to = "https://recall-sean-pen-hampshire.trycloudflare.com/api/:splat"
  status = 200
  force = true

# Live SSE updates (server-sent events)
[[redirects]]
  from = "/stream"
  to = "https://recall-sean-pen-hampshire.trycloudflare.com/stream"
  status = 200
  force = true

# Health check (handy for uptime pings & debugging)
[[redirects]]
  from = "/health"
  to = "https://recall-sean-pen-hampshire.trycloudflare.com/health"
  status = 200
  force = true
